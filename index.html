}

.credit{justify-self:end;margin-bottom:-4px;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--ink-2)}
.namefield input{
  height:36px;width:200px;max-width:100%;padding:0 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);user-select:text;-webkit-user-select:text
}
.grow{flex:1 1 0;min-width:0}
.btn{
  height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;cursor:pointer;white-space:nowrap
}
.btn:hover:not([disabled]){background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not([disabled]){background:var(--accent);filter:brightness(1.06)}
.btn[disabled]{opacity:.42;cursor:default}
.btn.icon{width:40px;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.solid{fill:currentColor;stroke:none}

.note{
  margin:0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);
  display:flex;gap:10px;align-items:center;justify-content:space-between
}
.note .btn{height:30px;flex:none}
.note span:not(.nexbo){flex:1;min-width:0}

.work{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start}
.tools{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:12px;
  transition:opacity .15s
}
.tools{position:relative}
.is-playing .tools{pointer-events:none}
.is-playing .tools > :not(.dancer){visibility:hidden}
.dancer{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;font:400 17px/1.25 var(--f-display);color:var(--ink)
}
.is-playing .dancer{display:flex}
.dancer .nexbo{height:150px;transform-origin:50% 100%;animation:dance var(--dance,.6s) ease-in-out infinite}
@keyframes dance{
  0%,100%{transform:translateY(0) rotate(-9deg) scale(1.03,.96)}
  25%{transform:translateY(-14px) rotate(0deg) scale(.97,1.04)}
  50%{transform:translateY(0) rotate(9deg) scale(1.03,.96)}
  75%{transform:translateY(-14px) rotate(0deg) scale(.97,1.04)}
}
.nexbo.hop{transform-origin:50% 100%;animation:hop .55s ease-out 3}
@keyframes hop{
  0%{transform:translateY(0) scale(1.08,.9)}
  30%{transform:translateY(var(--hop,-22px)) scale(.94,1.08)}
  60%{transform:translateY(0) scale(1.08,.9)}
  100%{transform:translateY(0) scale(1,1)}
}
.dialog .nexbo{--hop:-12px}
@media (prefers-reduced-motion:reduce){.dancer .nexbo,.nexbo.hop{animation:none}}
.tgroup{display:grid;gap:6px;min-width:0}
.tgroup.row{grid-template-columns:1fr 1fr}
.lbl{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between}
.tgroup[role="group"]{grid-template-columns:1fr 1fr}
.tool{
  height:56px;padding:0 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-weight:500;font-size:12.5px
}
.tool:last-child{grid-column:1/-1}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tool:hover{border-color:var(--ink-2)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.sizeprev{height:46px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.sizeprev i{display:block;border-radius:50%;background:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(3,28px);gap:6px;justify-content:space-between}
.sw{width:28px;height:28px;border-radius:8px;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.custom input{width:100%;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}

.stage{
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;
  display:grid;gap:8px;justify-items:center;min-width:0
}
.paper{
  position:relative;aspect-ratio:16/9;
  width:min(100%, max(360px, calc((100vh - 200px) * 1.7778)));
  max-width:100%
}
#view{
  width:100%;height:100%;display:block;background:#fff;border-radius:4px;touch-action:none;cursor:crosshair;
  box-shadow:0 1px 0 var(--line),0 8px 22px rgba(15,20,30,.14)
}
#view.fill{cursor:cell}
#view.move{cursor:move}
#view[data-tool="fill"]{cursor:cell}
#view[data-tool="move"]{cursor:move}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:4px}
#ring{
  position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;
  border:1.5px solid #1b2236;box-shadow:0 0 0 1px rgba(255,255,255,.85)
}
.statusbar{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}

.deck{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:10px;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar .group{display:flex;align-items:center;gap:6px}
.fps{display:flex;align-items:center;gap:8px}
.fps input{width:120px}
.fps output{min-width:5.5em;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.fr{
  flex:none;width:124px;padding:4px;border:2px solid transparent;border-radius:10px;background:var(--panel-2);
  display:grid;gap:3px;cursor:pointer;text-align:center
}
.fr canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.fr span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fr.on{border-color:var(--accent);background:var(--accent-soft)}
.fr.on span{color:var(--ink);font-weight:700}
.bar.guide{padding-top:10px;border-top:1px dashed var(--line)}
.guide .lbl{white-space:nowrap}
.gctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.ghint{color:var(--ink-2);font-size:12.5px}
.guide > .ghint{margin-left:auto}
.hint{margin:0;color:var(--ink-2);font-size:12.5px}
kbd{font:inherit;font-size:11.5px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--ink)}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.55);display:grid;place-items:center;padding:16px}
.dialog{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.dialog h2{margin:0;display:flex;align-items:center;gap:10px;font:400 22px/1.2 var(--f-display)}
.dialog p{margin:0;color:var(--ink-2)}
.dialog .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dialog select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.dialog .field{display:grid;gap:6px}
.dialog .fmt{display:grid;gap:8px}
.xmsg{min-height:1.5em}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:60;
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500
}

@media (max-width:820px){
  .work{grid-template-columns:minmax(0,1fr)}
  .tools{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:start}
  .tools .tgroup[role="group"]{grid-template-columns:repeat(5,1fr);grid-column:1/-1}
  .tool:last-child{grid-column:auto}
  .swatches{grid-template-columns:repeat(6,28px);justify-content:start}
  .namefield{flex:1 1 160px}.namefield input{width:100%}
}
@media (prefers-reduced-motion:reduce){.tools{transition:none}}
</style>

<body>


<div class="app" id="app">
  <div class="credit">미디어강사 김도경</div>
  <header class="top">
    <h1 class="logo"><span class="nexbo" role="img" aria-label="넥뽀" style="height:56px"></span><span>넥뽀 애니랩</span></h1>
    <label class="namefield"><span class="sr">작품 이름</span><input id="name" type="text" maxlength="30" value="내 애니메이션" autocomplete="off" spellcheck="false"></label>
    <div class="grow"></div>
    <button class="btn" id="btnNew" type="button">새로 만들기</button>
    <button class="btn" id="btnSaveProj" type="button" title="나중에 이어서 그릴 수 있는 .json 파일로 저장해요">작업 파일 저장</button>
    <button class="btn" id="btnOpen" type="button">불러오기</button>
    <button class="btn primary" id="btnExport" type="button">내보내기</button>
    <input type="file" id="openFile" accept=".json,application/json" hidden>
  </header>

  <p class="note" id="note" hidden><span class="nexbo" aria-hidden="true" style="height:60px"></span><span><b>신호 잡았다!</b> 예시 작품이에요. 그림을 고쳐 보거나, 위의 '새로 만들기'로 빈 화면에서 시작해 보세요.</span><button class="btn" id="noteClose" type="button">닫기</button></p>

  <div class="work">
    <aside class="tools" aria-label="그리기 도구">
      <div class="dancer" aria-hidden="true"><span class="nexbo"></span><span>신나게 재생 중!</span></div>
      <div class="tgroup" role="group" aria-label="도구">
        <button class="tool" type="button" data-tool="pen" aria-pressed="true" title="펜 (B)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19l-4 1z"/></svg><span>펜</span></button>
        <button class="tool" type="button" data-tool="eraser" aria-pressed="false" title="지우개 (E)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3l5 5-9.5 9.5H6L3 14.5 16 3z"/><path d="M9 21h12"/></svg><span>지우개</span></button>
        <button class="tool" type="button" data-tool="fill" aria-pressed="false" title="채우기 (G)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l7-7 7 7-7 7-7-7z"/><path d="M19 15c1 1.5 1.5 2.5 1.5 3.3a1.5 1.5 0 01-3 0c0-.8.5-1.8 1.5-3.3z"/></svg><span>채우기</span></button>
        <button class="tool" type="button" data-tool="move" aria-pressed="false" title="그림 전체를 끌어서 옮겨요 (V)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><span>옮기기</span></button>
        <button class="tool" type="button" data-tool="select" aria-pressed="false" title="올가미로 둘러서 골라 옮겨요 (L)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c4.4 0 8 2.2 8 5s-3.6 5-8 5-8-2.2-8-5 3.6-5 8-5z" stroke-dasharray="3 2.5"/><path d="M8 14c-1 2 0 4 2 5"/></svg><span>선택</span></button>
      </div>
      <div class="tgroup">
        <label class="lbl" for="size"><span>굵기</span><output id="sizeOut">6</output></label>
        <input type="range" id="size" min="1" max="60" value="6">
        <div class="sizeprev" aria-hidden="true"><i id="dot"></i></div>
      </div>
      <div class="tgroup">
        <span class="lbl">색깔</span>
        <div class="swatches" id="swatches"></div>
        <label class="custom"><span class="sr">다른 색 고르기</span><input type="color" id="custom" value="#1b2236"></label>
      </div>
      <div class="tgroup row">
        <button class="btn icon" id="undo" type="button" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 010 10H9"/></svg></button>
        <button class="btn icon" id="redo" type="button" title="다시 하기 (Ctrl+Y)" aria-label="다시 하기">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="transform:scaleX(-1)"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 010 10H9"/></svg></button>
      </div>
      <button class="btn" id="clearFrame" type="button">이 장면 지우기</button>
    </aside>

    <section class="stage" aria-label="그림 그리는 곳">
      <div class="paper">
        <canvas id="view" aria-label="그림 그리는 종이"></canvas>
        <canvas id="ov" aria-hidden="true"></canvas>
        <div id="ring" hidden></div>
      </div>
      <div class="statusbar"><span id="where">장면 1 / 1</span><span id="saveState" aria-live="polite"></span></div>
    </section>
  </div>

  <section class="deck" aria-label="장면 모음">
    <div class="bar">
      <div class="group">
        <button class="btn icon" id="prev" type="button" title="앞 장면 (←)" aria-label="앞 장면">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M19 5l-10 7 10 7z"/></svg></button>
        <button class="btn primary" id="play" type="button" title="재생 / 정지 (Space)" style="min-width:92px">
          <svg class="i solid" id="icPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="i solid" id="icPause" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></svg>
          <span id="playTxt">재생</span></button>
        <button class="btn icon" id="next" type="button" title="다음 장면 (→)" aria-label="다음 장면">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></svg></button>
      </div>
      <label class="fps" for="fps"><span>속도</span><input type="range" id="fps" min="1" max="24" value="8"><output id="fpsOut">8 장면/초</output></label>
      <label class="chk"><input type="checkbox" id="loop" checked>반복</label>
      <label class="chk" title="바로 앞 장면을 파랗게 흐리게 보여줘요"><input type="checkbox" id="onionP" checked>앞 장면 겹쳐 보기</label>
      <label class="chk" title="바로 다음 장면을 빨갛게 흐리게 보여줘요"><input type="checkbox" id="onionN">뒷 장면 겹쳐 보기</label>
      <div class="grow"></div>
      <div class="group">
        <button class="btn" id="addFrame" type="button" title="새 장면 (N)">+ 새 장면</button>
        <button class="btn" id="dupFrame" type="button" title="지금 장면을 복사 (D)">복제</button>
        <button class="btn" id="delFrame" type="button">삭제</button>
      </div>
    </div>
    <div class="bar guide" id="guideBar">
      <span class="lbl">밑그림</span>
      <button class="btn" id="gLoad" type="button" title="캐릭터 그림을 불러와 흐리게 깔고 따라 그려요">그림 불러오기</button>
      <div class="gctl" id="gCtl" hidden>
        <label class="fps" for="gAlpha"><span>투명도</span><input type="range" id="gAlpha" min="5" max="90" value="35"></label>
        <label class="fps" for="gScale"><span>크기</span><input type="range" id="gScale" min="20" max="300" value="100"></label>
        <button class="btn" id="gMove" type="button" aria-pressed="false">끌어서 옮기기</button>
        <label class="chk"><input type="checkbox" id="gShow" checked>보이기</label>
        <button class="btn" id="gStamp" type="button" title="불러온 그림을 지금 장면에 진하게 넣어요">이 장면에 넣기</button>
        <button class="btn" id="gClear" type="button">치우기</button>
        <span class="ghint" id="guideHelp" hidden>마우스로 끌어서 옮기고, 마우스 휠로 크기를 바꿔요.</span>
      </div>
      <span class="ghint">연습용으로만 따라 그려요. 인터넷 그림은 저작권을 확인해요.</span>
      <input type="file" id="gFile" accept="image/*" hidden>
    </div>
    <div class="strip" id="strip" role="list" aria-label="장면 목록"></div>
  </section>

  <p class="hint"><kbd>B</kbd> 펜 · <kbd>E</kbd> 지우개 · <kbd>G</kbd> 채우기 · <kbd>V</kbd> 옮기기 · <kbd>L</kbd> 선택 · <kbd>←</kbd><kbd>→</kbd> 장면 이동 · <kbd>N</kbd> 새 장면 · <kbd>D</kbd> 복제 · <kbd>Space</kbd> 재생 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기</p>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2><span class="nexbo" aria-hidden="true" style="height:46px"></span><span id="dlgTitle"></span></h2>
    <div id="dlgBody" style="display:grid;gap:14px"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

function canMp4() { return !!(window.VideoEncoder && window.VideoFrame && window.Mp4Muxer); }

  const bitrate = w >= 900 ? 6e6 : w >= 700 ? 4e6 : 2.5e6;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']) {
    const cfg = { codec, width: w, height: h, bitrate, framerate: fps, avc: { format: 'avc' } };
    try { const r = await VideoEncoder.isConfigSupported(cfg); if (r && r.supported) return cfg; } catch (e) { /* try next */ }

}
async function encodeMp4(w, say) {
  const FPS = 30, eh = Math.floor(w * 9 / 16 / 2) * 2;

  const cx = cv.getContext('2d');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: w, height: eh, frameRate: FPS }, fastStart: 'in-memory' });

  enc.configure(cfg);
  const n = state.frames.length, total = Math.max(1, Math.round(n * FPS / state.fps));
  let shown = -1;
  for (let j = 0; j < total; j++) {
    if (encErr) throw encErr;

    if (src !== shown) {
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, eh);
      cx.drawImage(state.frames[src].canvas, 0, 0, w, eh); shown = src;
    }
    const vf = new VideoFrame(cv, { timestamp: Math.round(j * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: j % 60 === 0 });
    vf.close();
    while (enc.encodeQueueSize > 6) { if (encErr) throw encErr; await sleep(4); }
    if (j % 15 === 0) { say(`MP4로 만드는 중 (${j + 1}/${total})`); await sleep(0); }

}
async function runExport(kind, w, say) {
  const h = Math.round(w * 9 / 16), n = state.frames.length;
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const tc = tmp.getContext('2d', { willReadFrequently: true });
  const paint = i => { tc.fillStyle = '#fff'; tc.fillRect(0, 0, w, h); tc.drawImage(state.frames[i].canvas, 0, 0, w, h); };
  let blob, ext;
  if (kind === 'png') {
    paint(state.cur); blob = await toBlob(tmp, 'image/png'); ext = 'png';
  } else if (kind === 'mp4') {
    blob = await encodeMp4(w, say);
    if (!blob) { say('이 브라우저는 MP4를 만들 수 없어요. GIF나 WebM으로 저장해 주세요.'); return; }
    ext = 'mp4';
  } else if (kind === 'gif') {
    const delay = Math.max(2, Math.round(100 / state.fps));
    blob = await buildGif(n, i => { paint(i); return tc.getImageData(0, 0, w, h).data; }, w, h, delay,
      (label, i, total) => say(`${label} (${i}/${total})`));
    ext = 'gif';
  } else {
    const stream = tmp.captureStream(0), track = stream.getVideoTracks()[0];
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));

    const stopped = new Promise(res => { rec.onstop = res; });
    rec.start();
    for (let i = 0; i < n; i++) {
      paint(i); if (track.requestFrame) track.requestFrame();
      say(`영상을 녹화하는 중 (${i + 1}/${n})`);
      await sleep(1000 / state.fps);
    }
    paint(n - 1); if (track.requestFrame) track.requestFrame();
    await sleep(150); rec.stop(); await stopped;
    blob = new Blob(chunks, { type: 'video/webm' }); ext = 'webm';
  }
  say('파일을 만들었어요. 나오는 창에서 저장을 눌러 주세요.');
  const r = await saveFile(safeName() + '.' + ext, blob);
  if (r === 'ok') say('저장했어요.');
  else if (r === 'declined') say('저장을 취소했어요. 다시 누르면 한 번 더 저장할 수 있어요.');
  else if (r === 'none') say('이 화면에서는 파일 저장이 막혀 있어요. 앱이나 새 탭에서 열어 주세요.');

const DB = 'next-media-flip', STORE = 'proj', KEY = 'current';

    });
    const d = new Date();
    saveMsg('이 브라우저에 자동 저장됨 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
  } catch (err) {
    storageOk = false; saveMsg('자동 저장을 쓸 수 없어요. \'작업 파일 저장\'을 이용해 주세요');
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; scheduleSave(); }
  }
}
async function restore() {
  try {
    const rec = await idbGet();
    if (!rec || !Array.isArray(rec.frames) || !rec.frames.length || rec.frames.length > MAX_FRAMES) return false;
    const frames = [];
    for (const blob of rec.frames) {
      const bmp = await createImageBitmap(blob);
      const f = makeFrame(); f.ctx.drawImage(bmp, 0, 0, W, H); f.blob = blob; f.dirty = false; frames.push(f);
    }
    setProject(frames, String(rec.name || '내 애니메이션').slice(0, 30), Math.min(24, Math.max(1, +rec.fps || 8)));
    if (rec.guide && rec.guide.blob) { try { await restoreGuide(rec.guide); } catch (e) { /* 밑그림만 건너뜀 */ } }
    saveMsg('지난 작품을 이어서 열었어요');
    return true;
  } catch (err) { return false; }
}

/* ---------- sample ---------- */
function sampleFrames() {
  const n = 8, frames = [], gy = 440;
  for (let i = 0; i < n; i++) {
    const f = makeFrame(), c = f.ctx, ph = i / (n - 1), h = 4 * ph * (1 - ph), x = 150 + i * 95;
    const onGround = i === 0 || i === n - 1;
    const rx = onGround ? 50 : 40, ry = onGround ? 30 : 40;
    const cy = onGround ? gy - 30 : gy - 40 - 260 * h;
    c.lineCap = 'round'; c.strokeStyle = '#1b2236'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(70, gy); c.lineTo(890, gy); c.stroke();
    c.fillStyle = 'rgba(27,34,54,0.16)';
    c.beginPath(); c.ellipse(x, gy + 16, 46 * (1 - 0.45 * h), 8 * (1 - 0.4 * h), 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f77f00';
    c.beginPath(); c.ellipse(x, cy, rx, ry, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.6)';
    c.beginPath(); c.ellipse(x - rx * 0.35, cy - ry * 0.4, rx * 0.18, ry * 0.12, -0.5, 0, Math.PI * 2); c.fill();
    frames.push(f);
  }
  return frames;
}

/* ---------- init ---------- */
(async () => {
  setSize(6); setColor('#1b2236'); setTool('pen'); setPlayUi(); setBeat();
  const ok = await restore();
  if (!ok) {
    setProject(sampleFrames(), '예시 통통 공', 8);
    note.hidden = false;
  }
  updateStatus();
})();
})();
</script>
